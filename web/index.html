<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking</title>
  <style>
    /* The FiveM game frame must stay visible around the panel and while it is closed. */
    html, body { background: transparent !important; color-scheme: normal !important; }
    [hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="https://cfx-nui-whip_core/html/css/fonts.css">
  <link rel="stylesheet" href="https://cfx-nui-whip_core/html/css/base.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <!-- The branch and the ATM draw into #app from app.js (render). -->
  <main id="app" tabindex="-1" hidden></main>

  <section id="card-preview" role="dialog" aria-modal="true" aria-labelledby="card-preview-title" hidden>
    <div class="card-preview-panel">
      <header class="preview-head">
        <h2 id="card-preview-title">Debit card</h2>
        <button id="card-preview-close" type="button">Close <kbd>Esc</kbd></button>
      </header>
      <div class="card-art">
        <img src="assets/whip_debit_card.png" alt="">
        <div class="card-personalization">
          <strong id="preview-account-number"></strong>
          <span id="preview-account-name"></span>
          <span id="preview-holder"></span>
        </div>
      </div>
      <footer class="preview-foot">
        <span id="preview-card-status"></span><span id="preview-last-four"></span>
      </footer>
      <p id="preview-error" role="status"></p>
    </div>
  </section>
</body>
</html>
